<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:transparent}
#notice{position:relative;width:100%;padding:14px 44px 14px 16px;border:1px solid #46536b;border-radius:10px;background:#171e2b;color:#edf2fa;overflow-wrap:anywhere}
h3{margin:0 0 7px;font-size:16px;line-height:1.3}p{margin:0;white-space:pre-line;font-size:14px;line-height:1.5}
#close{position:absolute;right:8px;top:8px;border:0;background:transparent;color:#edf2fa;border-radius:6px;width:32px;height:32px;font-size:23px;cursor:pointer}
#close:hover,#close:focus-visible{background:#33415a;outline:2px solid #93b9f9}
@media(max-width:480px){#notice{padding:12px 40px 12px 12px}h3{font-size:15px}p{font-size:13px}}
[hidden]{display:none!important}
</style></head><body>
<aside id="notice" role="status" aria-live="polite" hidden><button id="close" type="button" aria-label="Закрыть">×</button><h3 id="title"></h3><p id="message"></p></aside>
<script src="notice.js"></script>
</body></html>
